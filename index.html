<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="description" content="Treino Leve, seu treino sem enrolação"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>Treino Leve</title><style>
:root{--bg:#0f141b;--card:#171e28;--card2:#202a36;--text:#f4f7fa;--muted:#9aa7b5;--accent:#65d6c5;--danger:#ff7b7b;--line:#293442}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input{font:inherit}button{border:0}.app{max-width:680px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 18px calc(88px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.title{font-size:30px;font-weight:800}.sub{color:var(--muted);font-size:14px;margin-top:2px}.iconbtn,.primary,.secondary{border-radius:14px;padding:12px 15px;background:var(--card2);color:var(--text);cursor:pointer}.primary{background:var(--accent);color:#08201d;font-weight:800}.secondary{background:var(--card2)}.back{background:none;color:var(--text);font-size:27px;padding:0 10px 0 0}.row{display:flex;align-items:center;gap:12px}.grid{display:grid;gap:12px}.workout{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.workout h2,.exercise h3{margin:0 0 5px}.muted{color:var(--muted);font-size:13px}.arrow{font-size:25px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.exercise{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer}.exercise small{color:var(--muted)}.pill{display:inline-block;background:#263240;color:var(--muted);padding:6px 9px;border-radius:10px;font-size:12px;margin-top:8px}.section{margin-top:18px}.sectiontitle{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 9px}.history{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px}.history+.history{margin-top:8px}.series{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.set{background:var(--card2);border-radius:12px;padding:11px}.set b{display:block;font-size:18px}.set span{color:var(--muted);font-size:12px}.empty{padding:28px;text-align:center;color:var(--muted);background:var(--card);border-radius:16px}.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));width:min(640px,calc(100% - 36px));padding:15px;border-radius:16px;background:var(--accent);color:#08201d;font-weight:800}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:end center;padding:18px}.sheet{width:min(680px,100%);background:var(--card);border-radius:22px;padding:20px;max-height:85vh;overflow:auto}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text)}.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}.hidden{display:none}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#eafbf8;color:#08201d;padding:11px 15px;border-radius:12px;font-weight:700;box-shadow:0 8px 30px #0005}
</style></head><body><main class="app" id="app"></main><div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden"></div><script src="app.js"></script></body></html>
